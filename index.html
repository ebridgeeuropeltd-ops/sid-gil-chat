<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sid Gil — AI Digital Twin</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 80vh;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 16px;
      background: #ffffff;
      border-bottom: 1px solid #e1e4e8;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.4;
      font-size: 0.95rem;
    }
    .user {
      align-self: flex-end;
      background-color: #2563eb;
      color: white;
    }
    .bot {
      align-self: flex-start;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    .error {
      align-self: flex-start;
      background-color: #fee2e2;
      color: #991b1b;
    }
    .input-container {
      display: flex;
      padding: 12px;
      border-top: 1px solid #e1e4e8;
      background: #ffffff;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      font-size: 0.95rem;
    }
    button {
      margin-left: 8px;
      padding: 10px 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled {
      background-color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">🤖 Sid Gil — AI Digital Twin</div>
  <div class="chat-box" id="chatBox"></div>
  <div class="input-container">
    <input type="text" id="userInput" placeholder="Ask a question..." onkeydown="if(event.key === 'Enter') send()">
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
  let history = [
    { role: "system", content: "You are the AI Digital Twin of Sid Gil. Answer questions politely, concisely, and accurately on his behalf." }
  ];

  async function send() {
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    history.push({ role: "user", content: text });
    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "meta-llama/Llama-3.2-1B-Instruct",
          messages: history
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(JSON.stringify(data));

      const reply = data.choices[0].message.content;
      appendMessage(reply, "bot");
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      appendMessage("Error: " + err.message, "error");
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function appendMessage(text, className) {
    const box = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = `message ${className}`;
    msg.innerText = text;
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
  }
</script>

</body>
</html>
